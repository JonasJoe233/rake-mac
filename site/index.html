<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rake — free, open source disk cleanup for Mac</title>
<meta name="description" content="See where your Mac's space went, read the exact list, then clean. Free, open source, runs offline.">
<link rel="icon" href="icon.png">
<style>
/* 配色和 App 同一套（web/app.html 的 :root）。字号只用 5 档：56 标题 / 20 副标题 / 16 正文 / 14 按钮与小标题 / 12.5 注释 */
:root{
  --ground:#efebe1;--ink:#2a2926;--on-ink:#f4f1e9;--muted:#75726a;--rake:#cdc7b8;--line:rgba(42,41,38,.16);--hover:rgba(42,41,38,.05);
  --k-content:#2a2926;--k-tools:#75726a;--k-caches:#d3cec0;--k-system:#e3ded2;
  --t-content:#f4f1e9;--t-tools:#f4f1e9;--t-caches:#2a2926;--t-system:#75726a;
  --sans:-apple-system,BlinkMacSystemFont,"SF Pro Text","PingFang SC",system-ui,sans-serif;
  --mono:ui-monospace,"SF Mono",Menlo,monospace;color-scheme:light;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--ground);color:var(--ink);font:16px/1.6 var(--sans);-webkit-font-smoothing:antialiased;overflow-x:hidden}
a{color:inherit}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
:focus-visible{outline:1.5px solid var(--ink);outline-offset:3px;border-radius:6px}
.wrap{max-width:1240px;margin:0 auto;padding:0 32px}
nav{display:flex;align-items:center;gap:22px;height:64px;font-size:14px}
nav b{font-weight:600;font-size:16px;flex:1;display:flex;align-items:center;gap:10px}
nav b img{width:26px;height:26px}
nav a{text-decoration:none;color:var(--muted)} nav a:hover{color:var(--ink)}
#lang{color:var(--muted);font-size:14px} #lang:hover{color:var(--ink)}
.hero{display:grid;grid-template-columns:minmax(0,5fr) minmax(0,6fr);gap:40px;align-items:center;min-height:calc(100vh - 64px);max-height:900px;padding-bottom:40px}
h1{font-size:56px;line-height:1.08;font-weight:300;letter-spacing:-.025em;margin:0 0 20px;text-wrap:balance}
.sub{font-size:20px;line-height:1.5;color:var(--muted);margin:0 0 32px;max-width:30em;text-wrap:pretty}
.cta{display:flex;flex-wrap:wrap;gap:12px;align-items:stretch}
.btn{display:inline-flex;align-items:center;gap:10px;height:48px;padding:0 24px;border-radius:10px;background:var(--ink);color:var(--on-ink);text-decoration:none;font-weight:500;font-size:16px;white-space:nowrap}
.btn svg{width:17px;height:17px;fill:currentColor}
.btn:hover{background:#000}
.cmd{display:flex;align-items:center;gap:6px;height:48px;min-width:0;flex:1 1 300px;max-width:440px;border:1.25px solid var(--line);border-radius:10px;padding:0 6px 0 14px;font:12.5px var(--mono);background:var(--hover)}
.cmd code{flex:1;min-width:0;overflow-x:auto;white-space:nowrap;scrollbar-width:none}
.cmd code::-webkit-scrollbar{display:none}
.cmd button{font:500 14px var(--sans);padding:0 12px;height:34px;border-radius:7px}
.cmd button:hover{background:var(--hover)}
.cmdlabel{font-size:12.5px;color:var(--muted);margin:18px 0 6px}
.meta{font-size:12.5px;color:var(--muted);margin-top:16px}
#art{position:relative;width:100%;aspect-ratio:1.18;min-height:0}
#art svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.it .c{transition:none}
.it text{text-anchor:middle;pointer-events:none;fill:var(--tc);font-size:13px}
.it .sz{font-weight:300}
.k-content{--tc:var(--t-content)}.k-content .c{fill:var(--k-content)}
.k-tools{--tc:var(--t-tools)}.k-tools .c{fill:var(--k-tools)}
.k-caches{--tc:var(--t-caches)}.k-caches .c{fill:var(--k-caches)}
.k-system{--tc:var(--t-system)}.k-system .c{fill:var(--k-system)}
.k-unknown{--tc:var(--ink)}.k-unknown .c{fill:none;stroke:var(--ink);stroke-width:1.25;stroke-dasharray:1 4.5;stroke-linecap:round}
.k-free{--tc:var(--ink)}.k-free .c{fill:none}
.rk{fill:none;stroke:var(--rake);stroke-width:1}
.it.sel{--tc:var(--ink)}.it.sel .c{fill:var(--ground);stroke:var(--ink);stroke-width:2;stroke-dasharray:none}
section{padding:72px 0;border-top:1px solid var(--line)}
h2{font-size:14px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin:0 0 28px}
.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:32px}
.grid h3{font-size:20px;font-weight:500;line-height:1.3;margin:0 0 10px}
.grid p{margin:0;color:var(--muted)}
.steps{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:32px;counter-reset:s;margin:0;padding:0;list-style:none}
.steps li{counter-increment:s;font-size:20px;line-height:1.45}
.steps li::before{content:counter(s);display:flex;align-items:center;justify-content:center;width:30px;height:30px;border:1.25px solid var(--ink);border-radius:50%;font-size:14px;margin-bottom:14px}
.first{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:48px;align-items:start}
.first p{margin:0 0 14px}
.first .dim{color:var(--muted);font-size:14px}
.shot{aspect-ratio:16/10;border:1.25px dashed var(--muted);border-radius:12px;display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:14px;text-align:center;padding:16px}
footer{padding:32px 0 48px;font-size:12.5px;color:var(--muted);border-top:1px solid var(--line)}
@media (max-width:980px){.hero{grid-template-columns:minmax(0,1fr);min-height:0;max-height:none;padding-top:24px}.grid{grid-template-columns:repeat(2,minmax(0,1fr))}#art{aspect-ratio:1.3}}
@media (max-width:640px){.wrap{padding:0 20px}h1{font-size:40px}.sub{font-size:16px}.grid,.steps,.first{grid-template-columns:minmax(0,1fr)}.cmd{flex-basis:100%;max-width:none}.btn{width:100%;justify-content:center}section{padding:52px 0}nav a.gh{display:none}}
</style>
</head>
<body>
<div class="wrap">
 <nav><b><img src="icon.png" alt="">Rake</b><a class="gh" href="https://github.com/JonasJoe233/rake-mac">GitHub</a><button id="lang" type="button"></button></nav>
 <header class="hero">
  <div>
   <h1 data-t="site.h1"></h1>
   <p class="sub" data-t="site.sub"></p>
   <div class="cta">
    <a class="btn" id="dl" href="https://github.com/JonasJoe233/rake-mac/releases/latest/download/Rake.dmg"><svg viewBox="0 0 17 20" aria-hidden="true"><path d="M14.1 10.6c0-2.6 2.1-3.8 2.2-3.9-1.2-1.8-3.1-2-3.7-2-1.6-.2-3.1.9-3.9.9-.8 0-2-.9-3.4-.9C3.6 4.8 2 5.8 1.1 7.4c-1.9 3.2-.5 8 1.3 10.6.9 1.3 1.9 2.7 3.3 2.6 1.3-.1 1.8-.8 3.4-.8s2 .8 3.4.8c1.4 0 2.3-1.3 3.2-2.6 1-1.5 1.4-2.9 1.4-3-.1 0-2.9-1.1-3-4.4zM11.5 3c.7-.9 1.2-2 1.1-3.2-1 0-2.3.7-3 1.6-.7.8-1.2 2-1.1 3.1 1.2.1 2.3-.6 3-1.5z"/></svg><span data-t="site.download"></span></a>
   </div>
   <div class="cmdlabel" data-t="site.curlLabel"></div>
   <div class="cmd"><code id="cmd">curl -fsSL https://raw.githubusercontent.com/JonasJoe233/rake-mac/main/install.sh | bash</code><button id="copy" type="button" data-t="site.copy"></button></div>
   <div class="meta" id="meta"></div>
  </div>
  <div id="art" role="img"><svg id="svg"></svg></div>
 </header>
 <section>
  <div class="grid">
   <div><h3 data-t="site.f2.t"></h3><p data-t="site.f2.b"></p></div>
   <div><h3 data-t="site.f3.t"></h3><p data-t="site.f3.b"></p></div>
   <div><h3 data-t="site.f4.t"></h3><p data-t="site.f4.b"></p></div>
   <div><h3 data-t="site.f1.t"></h3><p data-t="site.f1.b"></p></div>
  </div>
 </section>
 <section>
  <h2 data-t="site.how.t"></h2>
  <ol class="steps"><li data-t="site.how.1"></li><li data-t="site.how.2"></li><li data-t="site.how.3"></li></ol>
 </section>
 <section id="first">
  <h2 data-t="site.first.t"></h2>
  <div class="first">
   <div>
    <p data-t="site.first.b1"></p>
    <p data-t="site.first.b2"></p>
    <p data-t="site.first.b3"></p>
    <p class="dim" data-t="site.first.curl"></p>
    <p class="dim" data-t="site.first.perm"></p>
   </div>
   <!-- TODO 截图待补：macOS 15「隐私与安全性 → 仍要打开」 -->
   <div class="shot" data-t="site.first.shot"></div>
  </div>
 </section>
 <footer><a href="https://github.com/JonasJoe233/rake-mac" data-t="site.footer"></a></footer>
</div>
<script src="pebbles.js"></script>
<script src="site.js"></script>
</body>
</html>
